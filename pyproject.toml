[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution framework"
requires-python = ">=3.10,<3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.scripts]
sandbox = "agent_smith.sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_smith"]